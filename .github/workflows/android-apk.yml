name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "buildozer.spec"
      - "requirements.txt"
      - "**.py"
      - "**.kv"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"

permissions:
  contents: read

# Do not cancel an in-progress Android build just because another push arrives.
concurrency:
  group: pauzenews-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pauzenews-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
