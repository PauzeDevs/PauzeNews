name: Android APK

# Normal code changes run lightweight Python checks only.
# Android packaging runs only for an explicitly marked release commit on main.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Do not cancel an in-progress Android build just because another push arrives.
concurrency:
  group: pauzenews-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Build debug APK
        shell: bash
        run: |
          # GitHub's default shell enables pipefail, which incorrectly fails
          # when 'yes' receives SIGPIPE after Buildozer has consumed its prompts.
          # Preserve the pipeline's rightmost command status (Buildozer's status).
          set +o pipefail
          yes | buildozer -v android debug

      - name: Verify APK output
        shell: bash
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Buildozer finished without producing an APK"
            exit 1
          fi
          ls -lh "$apk"

      - name: Publish stable v1.0.1 release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: PauzeNews v1.0.1 — Gold UI & In-App Reader
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk
          body: |
            # PauzeNews v1.0.1 — Gold UI & In-App Reader

            A quality-focused update to PauzeNews, with a premium charcoal-and-gold editorial identity and in-app article reading.

            ## Highlights
            - Premium near-black and charcoal surfaces with warm metallic-gold accents.
            - Rounded topic pills and action controls without unsupported icon glyphs.
            - Compact, full-width story cards with a clearer editorial hierarchy.
            - Publisher pages open inside PauzeNews with page-history and Android Back navigation.
            - Android package version aligned to the source version in this tag.

            ## Installation
            Download the APK attached to this release and install it on Android. If Android rejects an in-place update because the signing certificate differs from an older CI build, back up important local data before uninstalling the older copy.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - Developer profile: https://github.com/PauzeDevs
            - PauzeNews source: https://github.com/PauzeDevs/PauzeNews

            **Verification note:** The APK is attached only after the Android build and APK output check succeed. Physical-device verification is recommended for installation and publisher-specific WebView behavior.
