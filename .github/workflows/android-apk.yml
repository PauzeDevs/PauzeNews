name: Android APK

# Every push to main builds and verifies an Android APK.
# Only commits marked [release] publish a versioned GitHub Release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Do not cancel an in-progress Android build just because another push arrives.
concurrency:
  group: pauzenews-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          release_type=""
          version=""
          if [[ "$COMMIT_MESSAGE" =~ \[release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            release_type="stable"
            version="${BASH_REMATCH[1]}"
          elif [[ "$COMMIT_MESSAGE" =~ \[pre-release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)\] ]]; then
            release_type="prerelease"
            version="${BASH_REMATCH[1]}"
          fi

          if [[ -n "$release_type" ]]; then
            tag="v$version"
            if ! remote_tags="$(git ls-remote --tags origin)"; then
              echo "::error::Could not verify remote tags; refusing to publish without a successful tag check."
              exit 1
            fi
            if awk -v tag="refs/tags/$tag" '$2 == tag || $2 == tag "^{}" { found=1 } END { exit !found }' <<< "$remote_tags"; then
              echo "::error::Release tag $tag already exists. Use a new version; existing tags are never overwritten."
              exit 1
            fi
            echo "type=$release_type" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            # Keep Android's versionName aligned with the explicitly requested release.
            sed -i "s/^version = .*/version = $version/" buildozer.spec
            echo "Preparing $release_type release $tag"
          else
            echo "No explicit release marker found; this run will build and verify only."
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          # Preserve Buildozer's exit status when 'yes' receives SIGPIPE.
          set +o pipefail
          yes | buildozer -v android debug

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pauzenews-apk-${{ github.sha }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK output
        id: apk
        shell: bash
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Buildozer finished without producing an APK"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Publish stable release
        if: github.ref == 'refs/heads/main' && steps.release.outputs.type == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: PauzeNews v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            # PauzeNews v${{ steps.release.outputs.version }}

            This release was built by GitHub Actions from the exact source commit linked below.

            ## Included
            - Updated mobile editorial feed and story presentation.
            - Publication-time-aware headline ordering and local article cache migration.
            - Guarded category refreshes so stale requests cannot replace the selected feed.
            - Current RSS/Atom parser, bookmark store, and article-reader implementation.

            ## Build and verification
            - Built with the repository's Android workflow (Python 3.11, Java 17, Buildozer).
            - APK output was checked before release publication.
            - A successful CI build does not replace physical-device installation and article-reader testing.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - Developer profile: https://github.com/PauzeDevs
            - PauzeNews source: https://github.com/PauzeDevs/PauzeNews
            - Source commit: https://github.com/PauzeDevs/PauzeNews/commit/${{ github.sha }}

      - name: Publish pre-release
        if: github.ref == 'refs/heads/main' && steps.release.outputs.type == 'prerelease'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: PauzeNews v${{ steps.release.outputs.version }} — Preview
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            # PauzeNews v${{ steps.release.outputs.version }} — Preview

            Preview build for evaluation. This release was built from the source commit linked below.

            ## Build and verification
            - Built by GitHub Actions with Python 3.11, Java 17, and Buildozer.
            - APK output was checked before release publication.
            - Physical-device installation, scrolling, article-reader behavior, and Android Back handling still require hands-on verification.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - Developer profile: https://github.com/PauzeDevs
            - PauzeNews source: https://github.com/PauzeDevs/PauzeNews
            - Source commit: https://github.com/PauzeDevs/PauzeNews/commit/${{ github.sha }}
