name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "buildozer.spec"
      - "requirements.txt"
      - "**.py"
      - "**.kv"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"

permissions:
  contents: write

# Do not cancel an in-progress Android build just because another push arrives.
concurrency:
  group: pauzenews-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Build debug APK
        shell: bash
        run: |
          # GitHub's default shell enables pipefail, which incorrectly fails
          # when 'yes' receives SIGPIPE after Buildozer has consumed its prompts.
          # Preserve the pipeline's rightmost command status (Buildozer's status).
          set +o pipefail
          yes | buildozer -v android debug

      - name: Verify APK output
        shell: bash
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Buildozer finished without producing an APK"
            exit 1
          fi
          ls -lh "$apk"

      - name: Publish/update beta prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pauzenews-beta
          name: PauzeNews Beta — Latest Main Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk
          body: |
            Automated beta build from the latest successful `main` workflow run.

            **Testing build:** features and appearance may change. Download APKs only from the official PauzeNews Releases page.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PauzeNews ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            # PauzeNews ${{ github.ref_name }}

            ## Highlights
            - Premium charcoal interface with warm metallic-gold accents and rounded topic pills.
            - Compact, full-width editorial cards with clean READ and SAVE actions.
            - Publisher articles open inside PauzeNews instead of jumping to an external browser.
            - In-reader navigation supports both publisher-page history and Android Back.
            - Android package version is aligned with the release.

            ## Install
            Download the APK attached to this release and install it on Android. If Android rejects an in-place update because the signing certificate differs from an older CI build, back up any important local data before uninstalling the older copy.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - PauzeNews source: https://github.com/PauzeDevs/PauzeNews
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk

      - name: Publish stable v1.0.0
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[stable-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PauzeNews v1.0.0 — Stable Release
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk
          body: |
            # PauzeNews v1.0.0 — Stable Release

            The first stable release of PauzeNews, built from the latest main branch.

            ## Highlights
            - Premium charcoal interface with warm metallic-gold accents and rounded topic pills.
            - Compact full-width editorial cards with clear READ and SAVE actions.
            - Improved startup rendering and safer loading/error handling.
            - Staged initial story rendering with a Load More option.
            - Reduced concurrent feed requests for a more controlled startup experience.

            ## Installation
            1. Download the APK attached to this release.
            2. Open the downloaded APK on your Android device and follow the installation prompts.
            3. If Android blocks installation, allow your browser or file manager to install unknown apps, then retry.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - Source code: https://github.com/PauzeDevs/PauzeNews

            **Build note:** CI verifies that an APK is produced; device-specific behavior may vary by Android version.
