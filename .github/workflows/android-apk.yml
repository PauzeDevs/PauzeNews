name: Android APK

# Every push to main builds and verifies an Android APK.
# Only commits marked [release] publish a versioned GitHub Release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Do not cancel an in-progress Android build just because another push arrives.
concurrency:
  group: pauzenews-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Build debug APK
        shell: bash
        run: |
          # GitHub's default shell enables pipefail, which incorrectly fails
          # when 'yes' receives SIGPIPE after Buildozer has consumed its prompts.
          # Preserve the pipeline's rightmost command status (Buildozer's status).
          set +o pipefail
          yes | buildozer -v android debug

      - name: Verify APK output
        shell: bash
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Buildozer finished without producing an APK"
            exit 1
          fi
          ls -lh "$apk"

      - name: Publish stable v1.0.2 release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: PauzeNews v1.0.2 — Gold UI & In-App Reader
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk
          body: |
            # PauzeNews v1.0.2 — Gold UI & In-App Reader

            A reader-focused update to PauzeNews, with a refined editorial layout and a more resilient native article reader.

            ## Highlights
            - A distinct lead-story card with a gold accent rail and stronger visual hierarchy.
            - Publisher and publication time are separated to prevent cramped, truncated metadata.
            - Cleaner headline sizing, summary spacing, and action-button labels.
            - Article pages open in a dedicated native Android dialog above Kivy's rendering surface.
            - Android Back navigates publisher history or returns to headlines.
            - If native WebView setup is unavailable, PauzeNews attempts to open the validated article link in the system browser.
            - Android package version aligned to 1.0.2.

            ## Installation
            Download the APK attached to this release and install it on Android. If Android rejects an in-place update because the signing certificate differs from an older CI build, back up important local data before uninstalling the older copy.

            ## Links
            - PauzeX Developments: https://pauzex.devs.surf/
            - Developer profile: https://github.com/PauzeDevs
            - PauzeNews source: https://github.com/PauzeDevs/PauzeNews

            **Verification note:** The APK is attached only after the Android build and APK output check succeed. Physical-device verification is recommended for installation and publisher-specific WebView behavior.

      - name: Publish v1.0.3-rc.1 pre-release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[pre-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-rc.1
          name: PauzeNews v1.0.3-rc.1 — Horizontal Feed Preview
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: bin/*.apk
          body: |
            # PauzeNews v1.0.3-rc.1 — Horizontal Feed Preview

            This pre-release packages the latest editorial feed and article-reader improvements for Android evaluation.

            ## Highlights
            - Browse headlines in a horizontal, swipeable story rail.
            - Larger story cards with clearer spacing for headlines, summaries, publisher names, and publication times.
            - Open a story in the native article reader or use **OPEN ↗** to continue in the system browser.
            - Error and empty-feed states are sized for the story rail and retain a retry action when refreshing is available.

            ## Build notes
            - Built by GitHub Actions with Python 3.11, Java 17, Buildozer, and python-for-android.
            - The workflow verifies that an APK was produced before publishing this release.
            - Android target API 34; minimum API 24; APK includes arm64-v8a and armeabi-v7a.
            - The separate Python test workflow runs module compilation and unit tests for this commit.

            ## Install
            Download the APK attached to this pre-release and install it on an Android device. Android may ask you to allow your browser or file manager to install unknown apps. If a device rejects an in-place update because its signing certificate differs from an older CI build, back up important local data before uninstalling the older copy.

            This is a pre-release build. Physical-device installation and publisher-specific WebView behavior still need hands-on verification.
